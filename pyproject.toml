[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpsmcpmms"
# single source of truth: gpsmcpmms/__init__.py (see [tool.setuptools.dynamic]).
# Bump it for anything meant to be deployed -- `pip install git+...` compares
# versions, not commits, and silently installs nothing when the number is
# unchanged.
dynamic = ["version"]
description = "General-purpose shared configuration manager with a built-in web config-editor: modules declare typed parameters and get validation, persistence, a schema-driven editor and a multilingual UI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Saied Tazari" }]
keywords = [
    "configuration", "config", "config-editor", "settings",
    "flask", "i18n", "appliance", "schema", "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Flask",
]
dependencies = ["Flask>=3.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/saiedt/gpsmcpmms"
Repository = "https://github.com/saiedt/gpsmcpmms"
Issues = "https://github.com/saiedt/gpsmcpmms/issues"

# The code and its web assets live in the `gpsmcpmms` package; the ui/ files
# are bundled as package data, so a `pip install` is fully self-contained.
[tool.setuptools]
packages = ["gpsmcpmms"]

[tool.setuptools.dynamic]
version = { attr = "gpsmcpmms.__version__" }

[tool.setuptools.package-data]
gpsmcpmms = ["ui/*", "ui/lang/*"]
